spring.application.name=lumina-api
server.port=${PORT:8080}

# Importa variables de entorno desde .env local (formato clave=valor)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Base de datos MySQL ---
# Antes de arrancar, ejecuta data-base/01_schema.sql y data-base/02_seed.sql en MySQL.
# El usuario y la contraseña se leen de variables de entorno para no subirlas a GitHub.
# Si no existen, se usan los valores que van después de los dos puntos.
spring.datasource.url=jdbc:mysql://lumina-bd-g2nnx7.db.enzonic.com:3306/main?sslMode=REQUIRED
spring.datasource.username=u_1wmuezoliv
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---

# update: si falta alguna tabla, Hibernate la crea. No borra nada.
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000


