spring.application.name=lumina-api
server.port=8080

# --- Base de datos H2 (por defecto, para arrancar sin MySQL externo) ---
spring.datasource.url=jdbc:h2:mem:lumina;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Base de datos MySQL (producción) ---
# Antes de arrancar, ejecuta data-base/01_schema.sql y data-base/02_seed.sql en MySQL.
# El usuario y la contraseña se leen de variables de entorno para no subirlas a GitHub.
# spring.datasource.url=jdbc:mysql://localhost:3306/lumina?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
# spring.datasource.username=${DB_USER:root}
# spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
# update: si falta alguna tabla, Hibernate la crea. No borra nada.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
